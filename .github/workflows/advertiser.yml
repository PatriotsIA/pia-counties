name: Advertiser checks
on:
  push:
    branches: [advertiser-preview]
  pull_request:
    branches: [advertiser-preview]
permissions:
  contents: read
jobs:
  advertiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: bundled
